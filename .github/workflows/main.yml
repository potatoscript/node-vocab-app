name: CI Build Check

on:
  push:
    branches: [ potato ]
  pull_request:
    branches: [ potato ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v3

      - name: 🟢 Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: 📦 Install backend dependencies
        working-directory: ./jap-vocab-backend
        run: npm install

      - name: ✅ (Optional) Lint/Build backend
        working-directory: ./jap-vocab-backend
        run: |
          echo "Add backend lint/build steps here"

      - name: 📦 Install frontend dependencies
        working-directory: ./jap-vocab-client
        run: npm install

      - name: 🔧 Build frontend
        working-directory: ./jap-vocab-client
        run: npm run build
